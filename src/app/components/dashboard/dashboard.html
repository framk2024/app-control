<div class="card">
  <div class="card-content">
    <h2 class="card-title">Consumo Energético SAICL</h2>
    <p class="card-text">Datos en tiempo real desde el 01/01/2025</p>
  </div>

  <div class="bars-wrapper" [style.visibility]="loading ? 'hidden' : 'visible'">
    <app-comparison-bars 
      [reference]="historicalReference" 
      [planned]="totalTheoretical/3600" 
      [real]="totalReal/3600">
    </app-comparison-bars>
  </div>

  <div class="gauges-container" [style.visibility]="loading ? 'hidden' : 'visible'">
    <app-gauge 
      *ngFor="let light of lights; trackBy: trackById" 
      [value]="light.percentage"
      [plannedValue]="light.plannedPercentage"
      [label]="light.id">
    </app-gauge>
  </div>

  <div class="summary-details" [style.visibility]="loading ? 'hidden' : 'visible'">
    <div class="detail-item">
      <span>Ahorro vs Teórico</span>
      <span class="savings">{{ formatHours(totalSavings) }}h</span>
    </div>
    <div class="detail-item">
      <span>Consumo Total Real</span>
      <span class="real">{{ formatHours(totalReal) }}h</span>
    </div>
  </div>

  <div class="actions" [style.visibility]="loading ? 'hidden' : 'visible'">
    <button class="menu-btn" [routerLink]="['/']">Menú</button>
  </div>

  <div class="loading-state" *ngIf="loading">
    <p>Cargando datos desde la API...</p>
  </div>
</div>
