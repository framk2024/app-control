<div class="card">
  <img
    src="dashboard.png"
    alt="Vista del Parque Nacional del Manú"
    class="card-image"
  />

  <div class="card-content">
    <h2 class="card-title">Consumo</h2>
    <p class="card-text">01/01/2025 al 09/08/2025</p>
  </div>

  <div class="pill-group">
    @for (item of [ { title: 'Menú', link: '' }, ]; track item.title) {
    <a class="card-button" [routerLink]="item.link">
      <span>{{ item.title }}</span>
    </a>
    }
  </div>
</div>
